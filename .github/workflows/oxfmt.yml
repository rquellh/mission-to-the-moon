name: Oxfmt

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request replaces the older run. When deploy.yml runs
# the format check, it waits in a line of its own, never the deployment's.
concurrency:
  group: oxfmt-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This job changes no file. It fails when a file is not in the project's
  # format, and `npm run format` fixes that.
  #
  # A rule on the repository requires this job, by the name `oxfmt`, before
  # anything merges into main. Rename it and every pull request waits forever
  # on a check that never reports; change the rule's check name with it.
  # deploy.yml calls this job too and waits for it, so an unformatted file
  # stops the publish as well as the merge.
  oxfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the format
        run: npm run format:check
