name: Oxfmt

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request replaces the older run. When deploy.yml runs
# the format check, it waits in a line of its own, never the deployment's.
concurrency:
  group: oxfmt-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # This job changes no file. It fails when a file is not in the project's
  # format, and `npm run format` fixes that. deploy.yml calls this job and waits
  # for it, so an unformatted file stops the publish. The rule on the repository
  # that guards main names only `vitest` and `playwright`; add the check name
  # `oxfmt` there to make an unformatted file stop a merge as well.
  oxfmt:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the format
        run: npm run format:check
