name: Oxlint

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request replaces the older run. When deploy.yml runs
# the lint check, it waits in a line of its own, never the deployment's.
concurrency:
  group: oxlint-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A rule on the repository requires this job, by the name `oxlint`, before
  # anything merges into main. Rename it and every pull request waits forever
  # on a check that never reports; change the rule's check name with it.
  # deploy.yml calls this job too and waits for it, so a lint error stops the
  # publish as well as the merge.
  oxlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
