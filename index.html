<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="An interactive 3D tour of NASA's Gemini and Apollo programs, built with real NASA imagery."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23c9c9c4'/%3E%3Ccircle cx='11' cy='12' r='3' fill='%239a9a95'/%3E%3Ccircle cx='19' cy='20' r='4' fill='%239a9a95'/%3E%3C/svg%3E"
    />
    <title>Mission to the Moon</title>
  </head>
  <body data-testid="site">
    <canvas
      id="stage"
      class="stage"
      role="img"
      tabindex="0"
      aria-label="3D view of the mission"
      data-testid="scene-canvas"
    ></canvas>

    <!-- Everything a person reads and touches sits in this layer over the 3D view. -->
    <div class="hud" id="hud">
      <header class="masthead" id="masthead" data-testid="masthead">
        <div class="masthead__titles">
          <h1 class="masthead__site">Mission to the Moon</h1>
          <h2 class="masthead__mission">
            <!-- The mission's name opens the mission picker. -->
            <button
              type="button"
              class="masthead__switch"
              id="hub-button"
              aria-haspopup="dialog"
              data-testid="masthead-missions"
            >
              <span class="masthead__label">
                <span
                  class="masthead__name"
                  id="mission-name"
                  data-testid="masthead-mission-name"
                ></span>
                <span
                  class="masthead__dates"
                  id="mission-dates"
                  data-testid="masthead-mission-dates"
                ></span>
              </span>
            </button>
          </h2>
        </div>
      </header>

      <!-- What the camera looks at, and True scale: shown with Controls, and never without a 3D view. -->
      <div class="views" id="views" hidden data-testid="views">
        <!-- One button for each view the mission offers, added by the script. -->
        <div
          class="segmented"
          role="group"
          aria-label="Look at"
          id="view-buttons"
          data-testid="view-buttons"
        ></div>
        <div class="views__scale">
          <button
            type="button"
            class="switch"
            id="scale-toggle"
            aria-pressed="false"
            data-testid="scale-toggle"
          >
            <span class="switch__track" aria-hidden="true"><span class="switch__knob"></span></span>
            <span class="switch__label" id="scale-toggle-label">True scale</span>
          </button>
          <p class="views__note" id="scale-note" aria-live="polite" data-testid="scale-note"></p>
        </div>
      </div>

      <!-- Without a 3D view, a short note fills the space it would take. -->
      <div class="stage-note" id="stage-note" hidden data-testid="stage-note">
        <p class="stage-note__text" id="stage-note-text" data-testid="stage-note-text"></p>
      </div>

      <!-- "Tell me more": the records of the moment on the card. A panel at the side on a wide
           screen; on a phone it joins the card in one sheet. -->
      <section
        class="records"
        id="records"
        hidden
        aria-labelledby="records-title"
        data-testid="records"
      >
        <div class="records__head">
          <div class="records__titles">
            <p class="records__eyebrow" id="records-eyebrow" data-testid="records-eyebrow"></p>
            <h3
              class="records__title"
              id="records-title"
              tabindex="-1"
              data-testid="records-title"
            ></h3>
            <p class="records__time" id="records-time" data-testid="records-time"></p>
          </div>
          <button
            type="button"
            class="icon-button records__close"
            id="records-close"
            aria-controls="records"
            data-testid="records-close"
          ></button>
        </div>
        <!-- The body scrolls between the head and the reference links on a wide screen; on a phone the links scroll with it. -->
        <div class="records__scroll" id="records-scroll">
          <div class="records__body" id="records-body" data-testid="records-body"></div>
          <div class="records__links">
            <button
              type="button"
              class="records__link"
              id="records-about"
              aria-haspopup="dialog"
              aria-labelledby="records-about-name"
              aria-describedby="records-about-line"
              data-testid="records-about"
            >
              <span class="records__link-text">
                <span class="records__link-name" id="records-about-name"></span>
                <span class="records__link-line" id="records-about-line"></span>
              </span>
            </button>
            <button
              type="button"
              class="records__link"
              id="records-how-drawn"
              aria-haspopup="dialog"
              data-testid="records-how-drawn"
            >
              <span class="records__link-text"
                ><span class="records__link-name" id="records-how-drawn-name"
                  >How this is drawn</span
                ></span
              >
            </button>
            <button
              type="button"
              class="records__link"
              id="records-credits"
              aria-haspopup="dialog"
              data-testid="records-credits"
            >
              <span class="records__link-text"
                ><span class="records__link-name" id="records-credits-name"
                  >Sources and credits</span
                ></span
              >
            </button>
          </div>
        </div>
      </section>

      <!-- The moment card: the story of the moment on the clock, always on screen during a flight,
           with Play and its two doors, "Tell me more" and "Controls". -->
      <section class="dock" id="dock" aria-label="What is happening" data-testid="dock">
        <article class="card" id="card" aria-labelledby="card-title" data-testid="event-card">
          <p class="card__eyebrow" id="card-eyebrow" data-testid="event-card-eyebrow"></p>
          <h3 class="card__title" id="card-title" data-testid="event-card-title"></h3>
          <p class="card__short" id="card-short" data-testid="event-card-text"></p>
        </article>
        <div class="dock__media" id="dock-media">
          <!-- The photo's small picture, added by the script when the moment has one. -->
          <button
            type="button"
            class="card__thumb"
            id="card-photo"
            hidden
            data-testid="event-card-photo"
          ></button>
          <!-- "Finish" goes first once the clock has reached the end of the flight; then
               "Hear the recording", when the moment has one. -->
          <div class="card__actions" id="card-actions">
            <button
              type="button"
              class="button button--primary card__finish"
              id="card-finish"
              hidden
              data-testid="event-card-finish"
            >
              Finish
            </button>
            <button
              type="button"
              class="button dock__door"
              id="records-toggle"
              aria-expanded="false"
              aria-controls="records"
              data-testid="records-toggle"
            >
              <span class="dock__door-label" id="records-toggle-label">Tell me more</span>
            </button>
            <button
              type="button"
              class="button card__try"
              id="card-try"
              hidden
              data-testid="event-card-try-it"
            ></button>
            <p
              class="card__photo-credit"
              id="card-photo-credit"
              hidden
              data-testid="event-card-photo-credit"
            ></p>
          </div>
        </div>
        <section
          class="tour"
          id="tour"
          aria-label="Guided tour"
          hidden
          data-testid="tour-panel"
        ></section>
        <!-- The end of the flight, in the moment's place: what comes next, and "More to explore". Filled by the script. -->
        <section
          class="ending"
          id="ending"
          hidden
          aria-labelledby="ending-title"
          data-testid="ending"
        ></section>
        <div class="dock__transport" id="dock-transport">
          <button
            type="button"
            class="play"
            id="play"
            aria-label="Play"
            data-testid="timeline-play"
          ></button>
          <!-- On a phone: the chapter and the day, or the clock while Controls are open. -->
          <div
            class="dock__status"
            id="dock-status"
            role="group"
            aria-label="Where the flight is"
            data-testid="dock-status"
          >
            <p class="dock__where" id="dock-where">
              <span
                class="dock__chapter"
                id="dock-chapter"
                data-testid="dock-status-chapter"
              ></span>
              <span class="dock__day" id="dock-day" data-testid="dock-status-day"></span>
            </p>
          </div>
          <!-- How far through the flight, one segment per chapter. The scrubber in Controls is the real one. -->
          <div
            class="dock__progress"
            id="dock-progress"
            aria-hidden="true"
            data-testid="dock-progress"
          ></div>
          <button
            type="button"
            class="button dock__door dock__controls"
            id="controls-toggle"
            aria-expanded="false"
            aria-controls="timeline"
            data-testid="controls-toggle"
          >
            <span class="dock__door-label" id="controls-toggle-label">Controls</span>
          </button>
        </div>
        <section class="tools" id="timeline" aria-label="Timeline" hidden data-testid="timeline">
          <div class="tools__row">
            <button
              type="button"
              class="icon-button tools__step"
              id="event-previous"
              aria-label="Previous event"
              data-testid="event-card-previous"
            ></button>
            <button
              type="button"
              class="icon-button tools__step"
              id="event-next"
              aria-label="Next event"
              data-testid="event-card-next"
            ></button>
            <!-- On a phone, the clock moves to the card's status while Controls are open. -->
            <p class="clock" id="clock">
              <span class="clock__met" id="clock-met" data-testid="clock-time">00:00:00</span>
              <span class="clock__since" id="clock-since" data-testid="clock-since"
                >since liftoff</span
              >
              <span class="clock__day" id="clock-day" hidden data-testid="clock-day"></span>
              <span class="clock__fast" id="clock-fast" hidden data-testid="clock-fast-forward"
                >Fast forward</span
              >
            </p>
            <label class="pick pick--chapter">
              <span class="visually-hidden">Jump to a chapter</span>
              <select
                class="pick__select"
                id="chapter-select"
                data-testid="timeline-chapter-select"
              ></select>
            </label>
            <label class="pick pick--speed">
              <span class="visually-hidden">Speed</span>
              <select
                class="pick__select"
                id="speed-select"
                data-testid="timeline-speed-select"
              ></select>
            </label>
          </div>
          <div class="scrubber" id="scrubber">
            <div class="scrubber__rail" aria-hidden="true">
              <div class="scrubber__played"></div>
            </div>
            <div class="scrubber__ticks" id="scrubber-ticks" aria-hidden="true"></div>
            <input
              type="range"
              class="scrubber__input"
              id="scrubber-input"
              min="0"
              max="1"
              step="any"
              value="0"
              aria-label="Mission time"
              data-testid="timeline-scrubber"
            />
          </div>
          <div
            class="chapters"
            id="chapters"
            role="group"
            aria-label="Chapters"
            data-testid="timeline-chapters"
          ></div>
        </section>
      </section>
    </div>

    <!-- The welcome: the first thing a visitor sees. The mission on show, the ways into it, and "All missions". -->
    <section
      class="welcome"
      id="welcome"
      hidden
      aria-labelledby="welcome-title"
      data-testid="welcome"
    >
      <p class="welcome__site" id="welcome-site">Mission to the Moon</p>
      <div class="welcome__body">
        <div class="welcome__intro">
          <h2
            class="welcome__title"
            id="welcome-title"
            tabindex="-1"
            data-testid="welcome-title"
          ></h2>
          <p class="welcome__summary" id="welcome-summary" data-testid="welcome-summary"></p>
          <p class="welcome__dates" id="welcome-dates" data-testid="welcome-dates"></p>
          <!-- Without a 3D view, the note that says so (and Reload, when it may help). -->
          <p class="welcome__note" id="welcome-note" hidden data-testid="welcome-note"></p>
        </div>
        <div class="welcome__actions">
          <!-- The line under "Take the tour" sits inside the button on a phone and under both buttons on a wide screen. -->
          <button
            type="button"
            class="button button--primary button--large welcome__tour"
            id="welcome-tour"
            aria-labelledby="welcome-tour-label"
            aria-describedby="welcome-tour-stops"
            data-testid="welcome-tour"
          >
            <span class="welcome__tour-text">
              <span class="welcome__tour-label" id="welcome-tour-label">Take the tour</span>
              <span class="welcome__stops" id="welcome-tour-stops"></span>
            </span>
          </button>
          <button
            type="button"
            class="button button--quiet button--large welcome__explore"
            id="welcome-explore"
            data-testid="welcome-explore"
          >
            Explore on my own
          </button>
        </div>
        <button
          type="button"
          class="welcome__all"
          id="welcome-all-missions"
          aria-haspopup="dialog"
          aria-labelledby="welcome-all-missions-name"
          aria-describedby="welcome-all-missions-line"
          data-testid="welcome-all-missions"
        >
          <span class="welcome__all-text">
            <span class="welcome__all-name" id="welcome-all-missions-name">All missions</span>
            <span class="welcome__all-line" id="welcome-all-missions-line"></span>
          </span>
          <span class="welcome__count" id="welcome-all-missions-count" aria-hidden="true"></span>
        </button>
      </div>
    </section>

    <!-- The list of every mission, opened from the welcome and from the mission's name in the header. -->
    <dialog
      class="hub"
      id="hub"
      aria-labelledby="hub-title"
      aria-describedby="hub-lede"
      data-testid="hub"
    >
      <div class="hub__head">
        <div class="hub__intro">
          <h2 class="hub__title" id="hub-title" data-testid="hub-title">All missions</h2>
          <p class="hub__lede" id="hub-lede" data-testid="hub-lede"></p>
        </div>
        <button
          type="button"
          class="button button--quiet hub__close"
          id="hub-close"
          data-testid="hub-close"
        >
          Close
        </button>
      </div>
      <div class="hub__list" id="hub-list" data-testid="hub-list"></div>
    </dialog>

    <div class="loading" id="loading" role="status" data-testid="loading">
      <p class="loading__text" id="loading-text" data-testid="loading-text">Loading…</p>
      <progress class="loading__bar" id="loading-progress" max="3" value="0"></progress>
    </div>

    <div class="message" id="message" role="alert" hidden data-testid="message">
      <p class="message__text" id="message-text" data-testid="message-text"></p>
      <div class="message__actions">
        <button
          type="button"
          class="button"
          id="message-reload"
          hidden
          data-testid="message-reload"
        >
          Reload
        </button>
        <button
          type="button"
          class="button"
          id="message-action"
          hidden
          data-testid="message-action"
        ></button>
      </div>
    </div>

    <p class="visually-hidden" id="announcer" aria-live="polite" data-testid="announcer"></p>

    <dialog
      class="dialog"
      id="about-dialog"
      aria-labelledby="about-title"
      data-testid="about-dialog"
    >
      <div class="dialog__head">
        <h2 class="dialog__title" id="about-title" data-testid="about-dialog-title">
          About this mission
        </h2>
        <button
          type="button"
          class="button button--quiet dialog__close"
          data-testid="about-dialog-close"
        >
          Close
        </button>
      </div>
      <div class="dialog__body" id="about-body" data-testid="about-dialog-body"></div>
    </dialog>

    <dialog
      class="dialog dialog--narrow"
      id="drawn-dialog"
      aria-labelledby="drawn-title"
      data-testid="drawn-dialog"
    >
      <div class="dialog__head">
        <h2 class="dialog__title" id="drawn-title" data-testid="drawn-dialog-title">
          How this is drawn
        </h2>
        <button
          type="button"
          class="button button--quiet dialog__close"
          data-testid="drawn-dialog-close"
        >
          Close
        </button>
      </div>
      <div class="dialog__body" id="drawn-body" data-testid="drawn-dialog-body"></div>
    </dialog>

    <!-- A page of remembrance, for a crew that did not fly. Its content loads when it opens. -->
    <dialog
      class="dialog"
      id="memorial-dialog"
      aria-labelledby="memorial-title"
      data-testid="memorial-dialog"
    >
      <div class="dialog__head">
        <h2 class="dialog__title" id="memorial-title" data-testid="memorial-dialog-title"></h2>
        <button
          type="button"
          class="button button--quiet dialog__close"
          data-testid="memorial-dialog-close"
        >
          Close
        </button>
      </div>
      <div class="dialog__body" id="memorial-body" data-testid="memorial-dialog-body"></div>
    </dialog>

    <!-- An extra: a full-screen sheet with its title and Close; the extra fills the body. -->
    <dialog
      class="dialog dialog--full"
      id="extra-dialog"
      aria-labelledby="extra-title"
      data-testid="extra-sheet"
    >
      <div class="dialog__head">
        <h2 class="dialog__title" id="extra-title" data-testid="extra-sheet-title"></h2>
        <button
          type="button"
          class="button button--quiet dialog__close"
          data-testid="extra-sheet-close"
        >
          Close
        </button>
      </div>
      <div class="dialog__body" id="extra-body" data-testid="extra-sheet-body"></div>
    </dialog>

    <dialog
      class="dialog"
      id="credits-dialog"
      aria-labelledby="credits-title"
      data-testid="credits-dialog"
    >
      <div class="dialog__head">
        <h2 class="dialog__title" id="credits-title" data-testid="credits-dialog-title">
          Sources and credits
        </h2>
        <button
          type="button"
          class="button button--quiet dialog__close"
          data-testid="credits-dialog-close"
        >
          Close
        </button>
      </div>
      <div class="dialog__body" id="credits-body" data-testid="credits-dialog-body"></div>
    </dialog>

    <noscript>
      <p class="message">Mission to the Moon needs JavaScript turned on to show its 3D view.</p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
