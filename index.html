<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="An interactive 3D tour of NASA's Gemini and Apollo programs, built with real NASA imagery."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23c9c9c4'/%3E%3Ccircle cx='11' cy='12' r='3' fill='%239a9a95'/%3E%3Ccircle cx='19' cy='20' r='4' fill='%239a9a95'/%3E%3C/svg%3E"
    />
    <title>Mission to the Moon</title>
  </head>
  <body>
    <canvas id="stage" class="stage" role="img" tabindex="0" aria-label="3D view of the mission"></canvas>

    <!-- Everything a person reads and touches sits in this layer over the 3D view. -->
    <div class="hud" id="hud">
      <header class="masthead" id="masthead">
        <div class="masthead__titles">
          <h1 class="masthead__site">Mission to the Moon</h1>
          <h2 class="masthead__mission">
            <!-- The mission's name opens the mission picker. -->
            <button type="button" class="masthead__switch" id="hub-button" aria-haspopup="dialog">
              <span class="masthead__label">
                <span class="masthead__name" id="mission-name"></span>
                <span class="masthead__dates" id="mission-dates"></span>
              </span>
            </button>
          </h2>
        </div>
        <div class="masthead__actions">
          <button type="button" class="button button--quiet" id="about-button" aria-haspopup="dialog" aria-label="About this mission">
            <span>About<span class="wide-only"> this mission</span></span>
          </button>
          <button type="button" class="button button--quiet" id="credits-button" aria-haspopup="dialog" aria-label="Sources and credits">
            <span>Sources<span class="wide-only"> and credits</span></span>
          </button>
        </div>
      </header>

      <div class="views" id="views">
        <!-- One button for each view the mission offers, added by the script. -->
        <div class="segmented" role="group" aria-label="Look at" id="view-buttons"></div>
        <button type="button" class="switch" id="scale-toggle" aria-pressed="false">
          <span class="switch__track" aria-hidden="true"><span class="switch__knob"></span></span>
          <span class="switch__label">True scale</span>
        </button>
      </div>

      <p class="caption" id="caption">
        <span class="caption__note" id="scale-note" aria-live="polite"></span>
        <button type="button" class="caption__link" id="drawn-button" aria-haspopup="dialog">How this is drawn</button>
      </p>

      <aside class="sheet" id="sheet" data-state="compact" aria-labelledby="card-title">
        <button type="button" class="sheet__handle" id="sheet-handle" aria-expanded="false" aria-controls="card-body">
          <span class="sheet__grip" aria-hidden="true"></span>
          <span class="visually-hidden" id="sheet-handle-label">Show the whole card</span>
        </button>
        <section class="tour" id="tour" aria-label="Guided tour" hidden></section>
        <article class="card" id="card"></article>
      </aside>

      <section class="timeline" id="timeline" aria-label="Timeline">
        <button type="button" class="play" id="play" aria-label="Play"></button>
        <p class="clock" id="clock">
          <span class="clock__line">
            <span class="clock__met" id="clock-met">00:00:00</span>
            <span class="clock__since" id="clock-since">since liftoff</span>
          </span>
          <span class="clock__date">
            <span class="clock__day" id="clock-day" hidden></span>
            <span class="clock__utc" id="clock-utc"></span>
          </span>
        </p>
        <label class="pick pick--chapter">
          <span class="visually-hidden">Jump to a chapter</span>
          <select class="pick__select" id="chapter-select"></select>
        </label>
        <div class="scrubber" id="scrubber">
          <div class="scrubber__rail" aria-hidden="true"><div class="scrubber__played"></div></div>
          <div class="scrubber__ticks" id="scrubber-ticks" aria-hidden="true"></div>
          <input type="range" class="scrubber__input" id="scrubber-input" min="0" max="1" step="any" value="0" aria-label="Mission time" />
        </div>
        <div class="chapters" id="chapters" role="group" aria-label="Chapters"></div>
        <label class="pick pick--speed">
          <span class="visually-hidden">Speed</span>
          <select class="pick__select" id="speed-select"></select>
        </label>
      </section>
    </div>

    <!-- The mission picker: the welcome, and reopened from the mission's name in the header. -->
    <dialog class="hub" id="hub" aria-labelledby="hub-title" aria-describedby="hub-lede">
      <div class="hub__head">
        <div class="hub__intro">
          <h2 class="hub__title" id="hub-title" tabindex="-1">Mission to the Moon</h2>
          <p class="hub__lede" id="hub-lede"></p>
        </div>
        <button type="button" class="button button--quiet hub__close" id="hub-close" hidden>Close</button>
      </div>
      <div class="hub__list" id="hub-list"></div>
    </dialog>

    <div class="loading" id="loading" role="status">
      <p class="loading__text" id="loading-text">Loading…</p>
      <progress class="loading__bar" id="loading-progress" max="3" value="0"></progress>
    </div>

    <div class="message" id="message" role="alert" hidden>
      <p class="message__text" id="message-text"></p>
      <div class="message__actions">
        <button type="button" class="button" id="message-reload" hidden>Reload</button>
        <button type="button" class="button" id="message-action" hidden></button>
      </div>
    </div>

    <p class="visually-hidden" id="announcer" aria-live="polite"></p>

    <dialog class="dialog" id="about-dialog" aria-labelledby="about-title">
      <div class="dialog__head">
        <h2 class="dialog__title" id="about-title">About this mission</h2>
        <button type="button" class="button button--quiet dialog__close">Close</button>
      </div>
      <div class="dialog__body" id="about-body"></div>
    </dialog>

    <dialog class="dialog dialog--narrow" id="drawn-dialog" aria-labelledby="drawn-title">
      <div class="dialog__head">
        <h2 class="dialog__title" id="drawn-title">How this is drawn</h2>
        <button type="button" class="button button--quiet dialog__close">Close</button>
      </div>
      <div class="dialog__body" id="drawn-body"></div>
    </dialog>

    <!-- A page of remembrance, for a crew that did not fly. Its content loads when it opens. -->
    <dialog class="dialog" id="memorial-dialog" aria-labelledby="memorial-title">
      <div class="dialog__head">
        <h2 class="dialog__title" id="memorial-title"></h2>
        <button type="button" class="button button--quiet dialog__close">Close</button>
      </div>
      <div class="dialog__body" id="memorial-body"></div>
    </dialog>

    <dialog class="dialog" id="credits-dialog" aria-labelledby="credits-title">
      <div class="dialog__head">
        <h2 class="dialog__title" id="credits-title">Sources and credits</h2>
        <button type="button" class="button button--quiet dialog__close">Close</button>
      </div>
      <div class="dialog__body" id="credits-body"></div>
    </dialog>

    <noscript>
      <p class="message">Mission to the Moon needs JavaScript turned on to show its 3D view.</p>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
